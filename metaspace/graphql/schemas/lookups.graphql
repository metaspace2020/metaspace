type SubmitterSearchResult {
  id: ID!
  name: String!
}

enum SortingOrder {
  ASCENDING,
  DESCENDING
}

type ChemMod {
  name: String!
  chemMod: String!
}
type NeutralLoss {
  name: String!
  neutralLoss: String!
}

type Adduct {
  adduct: String!
  name: String!
  charge: Int!
  hidden: Boolean!
  default: Boolean!
}

type ScoringModel {
  id: Int!
  name: String!
  type: String!
  version: String!
  isArchived: Boolean
}

# Row of the ontology_term table (metadata schema v2 term store - see
# metaspace_metadata's docs/integration_metaspace.md SS6). One term may appear under more than one
# `subtree` without ambiguity (needed by instrument_model, which spans two PSI-MS roots).
type OntologyTerm {
  curie: String!
  label: String!
  synonyms: [String!]!
  ontology: String!
  subtree: String!
  obsolete: Boolean!
}

type Query {
  metadataSuggestions(field: String!, query: String!, limit: Int = 10): [String!]!

  submitterSuggestions(query: String!): [SubmitterSearchResult!]!

  chemModSuggestions(query: String): [ChemMod!]!

  neutralLossSuggestions(query: String): [NeutralLoss!]!

  adductSuggestions: [Adduct!]!

  colocalizationAlgos: [ColocalizationAlgo!]!

  scoringModels: [ScoringModel!]!

  # Autocomplete against the ontology term store, scoped to the slot's bound subtree(s)
  # (metadata schema v2 - see docs/integration_metaspace.md SS6-7). Trigram-ranked, label then
  # synonyms. `slot` is the LinkML slot name (e.g. "disease", "organism"), not a raw subtree CURIE -
  # the mapping between the two is intentionally not exposed to the client.
  ontologyTermSuggestions(slot: String!, query: String!, limit: Int = 10): [OntologyTerm!]!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
